<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Card #{{ order.order_no }} - {{ order.party }}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0ede6;font-family:'Segoe UI',Arial,sans-serif;color:#1a1a1a;padding:24px}
@media print { body{background:#fff;padding:0} }
@page { size: A4 portrait; margin: 10mm; }
.print-sheet{background:#fff;margin:0 auto;padding:28px 30px;box-shadow:0 8px 30px rgba(25,35,56,.25);width:794px}
@media print { .print-sheet{box-shadow:none;width:auto;padding:0} }
.ps-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #192338;padding-bottom:10px;margin-bottom:14px}
.ps-company{display:flex;align-items:center;gap:10px}
.ps-logo{width:42px;height:42px;border-radius:9px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#192338;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.ps-co{font-size:19px;font-weight:800;color:#192338;letter-spacing:.5px}
.ps-tag{font-size:11px;color:#8a8f98}
.ps-jc{font-size:15px;color:#192338;letter-spacing:1px;font-weight:700;border:2px solid #192338;padding:6px 14px;border-radius:8px}
.ps-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #c9c4b8;border-radius:8px;overflow:hidden;margin-bottom:14px}
.ps-cell{border-right:1px solid #c9c4b8;border-bottom:1px solid #c9c4b8;padding:6px 10px;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.ps-cell:nth-child(4n){border-right:none}
.ps-cell:nth-last-child(-n+4){border-bottom:none}
.ps-lbl{font-size:9px;letter-spacing:.8px;color:#8a8f98;font-weight:700;text-transform:uppercase}
.ps-val{font-size:13px;font-weight:600}
.ps-dispatch{border:1px solid #c9c4b8;background:#f6f4ee;padding:6px 10px;font-size:11.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ps-proc{width:100%;border-collapse:collapse;margin-bottom:14px}
.ps-proc th{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:#8a8f98;background:#f6f4ee;border:1px solid #c9c4b8;padding:4px 6px;text-align:left}
.ps-proc td{border:1px solid #c9c4b8;padding:3px 6px;font-size:11px;min-height:20px}
.ps-procname{font-weight:700;font-size:11px !important}
.ps-bottom{display:flex;border:1px solid #c9c4b8;border-radius:8px;overflow:hidden;margin-bottom:14px}
.ps-bottom .ps-cell{border-bottom:none}
.ps-bottom .ps-cell:last-child{border-right:none}
.ps-sign{border:1px solid #c9c4b8;border-radius:8px;padding:8px 12px}
.ps-sign-line{min-height:34px;border-bottom:1.5px dashed #9a9a9a;margin-top:6px;font-size:13px;font-weight:600}
.mono{font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
{% include "_jobcard_print.html" %}
</body>
</html>
